[workspace]
resolver = "2"
members = [
  "medusa-domain",
  "medusa-config",
  "medusa-store",
  "medusa-forge",
  "medusa-eval",
  "medusa-build",
  "medusa-sched",
  "medusa-web",
  "medusa-control",
  "medusa-daemon",
  "medusactl",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
medusa-domain = { path = "medusa-domain" }
medusa-config = { path = "medusa-config" }
medusa-store = { path = "medusa-store" }

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", default-features = false, features = [
  "serde",
  "clock",
  "std",
] }

tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "io-util",
  "process",
  "signal",
  "sync",
  "time",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "macros",
  "migrate",
] }

clap = { version = "4", features = ["derive"] }
tempfile = "3"
