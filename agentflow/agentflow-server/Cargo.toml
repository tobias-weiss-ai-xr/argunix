[package]
name = "agentflow-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
agentflow-core = { path = "../agentflow-core" }
agentflow-agents = { path = "../agentflow-agents" }

# HTTP server
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Configuration and environment
config = "0.13"
dotenv = "0.15"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging (optional, for future)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI documentation (optional)
utoipa = { version = "4.0", features = ["chrono", "uuid"], optional = true }

# Prometheus metrics (optional)
prometheus = { version = "0.13", features = ["process"], optional = true }

[dev-dependencies]
# For testing
reqwest = { version = "0.12", features = ["json"] }
httpmock = "0.6"
tokio-test = "0.4"

[features]
default = []
full = ["openapi", "metrics"]
openapi = ["utoipa"]
metrics = ["prometheus"]
