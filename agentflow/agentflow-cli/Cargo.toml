[package]
name = "agentflow-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
agentflow-core = { path = "../agentflow-core" }
agentflow-agents = { path = "../agentflow-agents" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
