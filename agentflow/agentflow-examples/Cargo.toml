[package]
name = "agentflow-examples"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agentflow-core = { path = "../agentflow-core" }
agentflow-agents = { path = "../agentflow-agents" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Logging (unused currently)
# log = "0.4"
# pretty_env_logger = "0.5"
