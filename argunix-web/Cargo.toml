[package]
name = "argunix-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "argunix-web-dev"
path = "src/bin/dev.rs"

[dependencies]
argunix-builders = { path = "../argunix-builders" }
argunix-config = { workspace = true }
argunix-domain = { workspace = true }
argunix-forge = { path = "../argunix-forge" }
argunix-nom = { workspace = true }
argunix-store = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
askama = { workspace = true }
tower-http = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = "0.13"
# Used by `synthetic_flake` to pack a single `flake.nix` into a tar
# response that nix's tarball flake fetcher can consume directly.
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# `PR_SET_PDEATHSIG` for the dev binary so the spawned tailwind --watch
# child gets reaped even if the parent dies via SIGKILL or panic.
libc = "0.2"
