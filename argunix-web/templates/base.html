{%- import "_macros.html" as m -%}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}argunix{% endblock %}</title>
    <link rel="stylesheet" href="/static/ui.css" />
    <script src="/static/htmx.min.js" defer></script>
    <style>
      @keyframes argunix-spin { to { transform: rotate(360deg); } }
      .argunix-spin { animation: argunix-spin 4s linear infinite; }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="bg-bg text-fg font-sans">
    <header class="max-w-5xl mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a class="flex items-center gap-3 no-underline text-fg" href="/">
          {% call m::logo(cluster_active, false) %}
          <span class="text-xl font-semibold">argunix</span>
        </a>
        <span class="font-semibold text-subtle hidden lg:block">
          Your CI is too good to be locked in a forge.
        </span>
      </div>
      <nav class="font-medium text-muted flex items-center gap-6">
        <a class="hover:underline" href="/">status</a>
        <a class="hover:underline" href="/repos">repos</a>
        <a class="hover:underline" href="/cache">cache</a>
        <a class="hover:underline" href="/hosts">hosts</a>
      </nav>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>
    <footer class="max-w-5xl mx-auto px-4 py-4 text-xs text-muted">
      argunix CI
    </footer>
    <script>
      {# Global copy-target listener. Any element with `data-copy-target="<id>"`
         on it copies the matching element's text to the clipboard on click.
         Reads `.value` for inputs/textareas, falls back to `.textContent` for
         <pre> + everything else. Event-delegated so it works for snippets
         added dynamically and pages that don't include their own script. #}
      document.addEventListener('click', async (ev) => {
        const btn = ev.target.closest('button[data-copy-target]');
        if (!btn) return;
        const target = document.getElementById(btn.dataset.copyTarget);
        if (!target) return;
        const text = ('value' in target && target.value)
          || target.textContent
          || '';
        if (!btn.dataset.originalText) {
          btn.dataset.originalText = btn.textContent;
        }
        const restore = () => { btn.textContent = btn.dataset.originalText; };
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = 'copied';
          setTimeout(restore, 1200);
        } catch (_) {
          {# Fallback for older browsers / http:// origins where the
             async clipboard API is gated: select + execCommand. #}
          try {
            if (target.select) target.select();
            else {
              const range = document.createRange();
              range.selectNodeContents(target);
              const sel = window.getSelection();
              sel.removeAllRanges();
              sel.addRange(range);
            }
            document.execCommand('copy');
            btn.textContent = 'copied';
            setTimeout(restore, 1200);
          } catch (_) { /* give up */ }
        }
      });
    </script>
  </body>
</html>
