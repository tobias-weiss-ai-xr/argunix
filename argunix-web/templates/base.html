<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}argunix{% endblock %}</title>
    <link rel="stylesheet" href="/static/ui.css" />
    <script src="/static/htmx.min.js" defer></script>
    <style>
      @keyframes argunix-spin { to { transform: rotate(360deg); } }
      .argunix-spin { animation: argunix-spin 4s linear infinite; }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans">
    <header class="max-w-5xl mx-auto px-4 pt-6 pb-2 flex items-center justify-between">
      <a class="flex items-center gap-3 no-underline text-slate-900" href="/">
        <img
          id="argunix-logo"
          src="/static/img/argunix-logo-square.svg"
          alt="argunix"
          class="h-10 w-10{% if cluster_active %} argunix-spin{% endif %}"
        />
        <span class="text-xl font-semibold">argunix</span>
      </a>
      <nav class="text-sm flex items-center gap-4">
        <a class="text-blue-600 hover:underline" href="/">status</a>
        <a class="text-blue-600 hover:underline" href="/repos">repos</a>
      </nav>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>
    <footer class="max-w-5xl mx-auto px-4 py-4 text-xs text-slate-500">
      argunix CI
    </footer>
  </body>
</html>
