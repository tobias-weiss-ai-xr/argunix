{# Shared markup fragments. Imported by other templates with
   `{% import "_macros.html" as m %}` and invoked via `{% call %}`. #}

{# Header logo. The `cluster_active` flag drives the spin animation
   (see `argunix-spin` in `base.html`'s <style>). The logo lives outside
   the htmx-polled status container; `_status_fragment.html` keeps its spin
   state in sync by toggling the class on this node, instead of re-rendering
   it, so the animation isn't reset on every 5s poll. #}
{% macro logo(cluster_active) -%}
<img
  id="argunix-logo"
  src="/static/img/argunix-logo-square.svg"
  alt="argunix"
  class="h-10 w-10{% if cluster_active %} argunix-spin{% endif %} dark:invert"
/>
{%- endmacro %}

{# Top-bar navigation links. Shared by the wide-screen inline `<nav>` and the
   small-screen hamburger menu in `base.html` so the link list stays in one
   place. `item_class` is applied to every `<a>` (the two contexts want
   different spacing). #}
{% macro nav_links(item_class) -%}
<a class="{{ item_class }}" href="/">status</a>
<a class="{{ item_class }}" href="/repos">repos</a>
<a class="{{ item_class }}" href="/cache">cache</a>
<a class="{{ item_class }}" href="/hosts">hosts</a>
{%- endmacro %}

{# Copy-pasteable `nix run` snippet for the synthetic-flake feature.
   Used on the repo, eval, and job pages — `id` must be unique per
   page, `command` is the literal shell line. `note` is rendered as
   trailing helper text and may be empty. The matching copy button
   is handled by the global `data-copy-target` listener in base.html. #}
{% macro nix_run_snippet(id, command, note) -%}
<section class="mb-6 rounded border border-border bg-surface p-3">
  <div class="flex items-baseline justify-between gap-2 mb-2 flex-wrap">
    <h2 class="text-sm font-semibold">Run from cache</h2>
    <button
      type="button"
      class="px-3 py-1 rounded border border-border text-xs hover:border-link"
      data-copy-target="{{ id }}"
    >copy</button>
  </div>
  <pre
    id="{{ id }}"
    class="font-mono text-xs whitespace-pre-wrap break-all px-3 py-2 rounded border border-border bg-bg text-fg overflow-x-auto"
  >{{ command }}</pre>
  {% if !note.is_empty() %}
  <p class="text-xs text-muted mt-2">{{ note|safe }}</p>
  {% endif %}
  <p class="text-xs text-muted mt-2">
    Requires this argunix's cache in
    <code class="font-mono">trusted-substituters</code> +
    <code class="font-mono">trusted-public-keys</code> — see
    <a class="text-link hover:underline" href="/cache">/cache</a> for
    the one-time setup snippet.
  </p>
</section>
{%- endmacro %}

{# Copy-pasteable `docker run` snippet for an image argunix pushed to a
   registry — the image counterpart of `nix_run_snippet`. `idx` makes
   the element id unique when a page renders several (one per
   registry); `command` is the literal shell line. The copy button is
   handled by the global `data-copy-target` listener in base.html. #}
{% macro registry_run_snippet(idx, command) -%}
<section class="mb-4 rounded border border-border bg-surface p-3">
  <div class="flex items-baseline justify-between gap-2 mb-2 flex-wrap">
    <h2 class="text-sm font-semibold">Run from registry</h2>
    <button
      type="button"
      class="px-3 py-1 rounded border border-border text-xs hover:border-link"
      data-copy-target="snippet-registry-run-{{ idx }}"
    >copy</button>
  </div>
  <pre
    id="snippet-registry-run-{{ idx }}"
    class="font-mono text-xs whitespace-pre-wrap break-all px-3 py-2 rounded border border-border bg-bg text-fg overflow-x-auto"
  >{{ command }}</pre>
  <p class="text-xs text-muted mt-2">
    Pulls the image straight from the registry argunix pushed it to —
    no Nix required. <code class="font-mono">podman run</code> works
    the same way.
  </p>
</section>
{%- endmacro %}
