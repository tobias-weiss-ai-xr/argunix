{# Shared markup fragments. Imported by other templates with
   `{% import "_macros.html" as m %}` and invoked via `{% call %}`. #}

{# Header logo. The `cluster_active` flag drives the spin animation
   (see `argunix-spin` in `base.html`'s <style>); `oob_swap` adds the
   `hx-swap-oob` attribute used by the htmx polling response from
   `/_/status` to keep the spinner in sync between full navigations. #}
{% macro logo(cluster_active, oob_swap) -%}
<img
  id="argunix-logo"
  {%- if oob_swap %} hx-swap-oob="true"{% endif %}
  src="/static/img/argunix-logo-square.svg"
  alt="argunix"
  class="h-10 w-10{% if cluster_active %} argunix-spin{% endif %} dark:invert"
/>
{%- endmacro %}
